# FrameworkOnCore's packages, built here instead of on a developer's machine: FrameworkOnCore.Runtime/ (upstream taken
# in by git subtree, maintained in this repository) built and packed (pack-frameworkoncore.ps1, Release), tested on Linux against
# them (the test suite in the .NET SDK's container, as run-tests-linux.ps1 runs it), and published as the GitHub Release
# frameworkoncore-<frameworkOnCoreVersion> (publish-frameworkoncore.ps1) that the converter, the analysis and Studio fetch.
#
# A version is published once. A push that changes FrameworkOnCore's WebFormsForCore (FrameworkOnCore.Runtime/, pack-frameworkoncore.ps1, the rules' frameworkOnCoreVersion)
# publishes its version when there is no release of it yet; with one, the run warns (changed packages is a new version:
# raise frameworkOnCoreVersion in src/FrameworkOnCore.Converter/rules/packages.json, and pack-frameworkoncore.ps1's default). Run by hand
# (workflow_dispatch) it builds and tests, and publishes only when asked.
#
# The Windows tests are not run here: their goldens are this project's Windows machine's (GDI+ drawing with its fonts,
# a Japanese Windows' system font, IIS, SQL Server Express); run them there (dotnet test tests/FrameworkOnCore.Tests).
name: FrameworkOnCore packages

on:
  push:
    branches: [main, 'pivot/**']
    paths:
      - 'FrameworkOnCore.Runtime/**'
      - 'experiments/wf4c/pack-frameworkoncore.ps1'
      - 'experiments/wf4c/frameworkoncore.slnx'
      - 'src/FrameworkOnCore.Converter/rules/packages.json'
      - '.github/workflows/frameworkoncore-packages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release frameworkoncore-<frameworkOnCoreVersion> (when there is none yet)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: frameworkoncore-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: version
        name: frameworkOnCoreVersion of the rules
        shell: pwsh
        run: |
          $rules = Get-Content src/FrameworkOnCore.Converter/rules/packages.json -Raw
          $version = [regex]::Match($rules, '"frameworkOnCoreVersion"\s*:\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'no frameworkOnCoreVersion in rules/packages.json' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and pack
        shell: powershell
        run: .\experiments\wf4c\pack-frameworkoncore.ps1 -Build All -Version ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: frameworkoncore-feed-${{ steps.version.outputs.version }}
          path: experiments/wf4c/_feed/*
          if-no-files-found: error
      # The build tasks FrameworkOnCore's projects import (FakeStrongName): the Linux tests build two of them from source.
      - uses: actions/upload-artifact@v4
        with:
          name: frameworkoncore-build-tasks
          path: FrameworkOnCore.Runtime/lib/WebFormsForCore.Build/
          if-no-files-found: error

  test-linux:
    needs: build
    runs-on: ubuntu-latest
    # The image run-tests-linux.ps1 runs the tests in (its libgdiplus and fonts are what the Linux known differences
    # were measured with).
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - name: libgdiplus and fonts
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libgdiplus fonts-liberation2
      - uses: actions/download-artifact@v4
        with:
          name: frameworkoncore-feed-${{ needs.build.outputs.version }}
          path: experiments/wf4c/_feed
      - uses: actions/download-artifact@v4
        with:
          name: frameworkoncore-build-tasks
          path: FrameworkOnCore.Runtime/lib/WebFormsForCore.Build
      - name: Tests (Linux)
        run: dotnet test tests/FrameworkOnCore.Tests/FrameworkOnCore.Tests.csproj -nologo -v q

  publish:
    needs: [build, test-linux]
    if: github.event_name == 'push' || inputs.publish
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The whole history: the release names the upstream commit FrameworkOnCore.Runtime/ was taken from (git subtree's record).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Is the version published?
        shell: pwsh
        run: |
          gh release view "frameworkoncore-$env:VERSION" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            # Not published again. If the push changed FrameworkOnCore's WebFormsForCore, its packages are not the published ones.
            "::warning::frameworkoncore-$env:VERSION is published already: not published again. If FrameworkOnCore's WebFormsForCore changed (FrameworkOnCore.Runtime/), raise frameworkOnCoreVersion (src/FrameworkOnCore.Converter/rules/packages.json and pack-frameworkoncore.ps1)"
          } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.exists == 'false'
        with:
          name: frameworkoncore-feed-${{ needs.build.outputs.version }}
          path: experiments/wf4c/_feed
      - name: Publish frameworkoncore-${{ needs.build.outputs.version }}
        if: steps.release.outputs.exists == 'false'
        shell: powershell
        run: .\experiments\wf4c\publish-frameworkoncore.ps1 -Version $env:VERSION -Repository $env:GITHUB_REPOSITORY
